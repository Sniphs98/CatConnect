name: build

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      release:
        description: "Release: the version counts up from the last tag (patch 0.1.3 → 0.1.4, minor → 0.2.0, major → 1.0.0)"
        type: choice
        options: [patch, minor, major, none]
        default: patch

concurrency:
  group: build-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: false

env:
  WAILS_VERSION: v3.1.0
  IMAGE: ghcr.io/sniphs98/catconnect-server

jobs:
  version:
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.v.outputs.version }}
      number: ${{ steps.v.outputs.number }}
      release: ${{ steps.v.outputs.release }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # all tags
      - id: v
        run: .github/scripts/version.sh
        env:
          BUMP: ${{ github.event_name == 'workflow_dispatch' && inputs.release || 'none' }}
          FIRST: v0.1.0

  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      # The client package links GTK; vet needs it even though the tests don't.
      - run: sudo apt-get update && sudo apt-get install -y libgtk-4-dev libwebkitgtk-6.0-dev
      - run: mkdir -p client/frontend/dist && touch client/frontend/dist/.keep
      - run: go vet ./...
      - run: go test ./internal/...

  server:
    needs: [test, version]
    runs-on: ubuntu-24.04
    env:
      VERSION: ${{ needs.version.outputs.version }}
    strategy:
      matrix:
        include:
          - { goos: linux, goarch: amd64 }
          - { goos: linux, goarch: arm64 }
          - { goos: windows, goarch: amd64, ext: .exe }
          - { goos: darwin, goarch: arm64 }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: |
          CGO_ENABLED=0 GOOS=${{ matrix.goos }} GOARCH=${{ matrix.goarch }} \
            go build -trimpath -ldflags="-s -w -X main.version=${VERSION}" \
            -o bin/catconnect-server-${{ matrix.goos }}-${{ matrix.goarch }}${{ matrix.ext }} ./cmd/catconnect-server
      - uses: actions/upload-artifact@v4
        with:
          name: catconnect-server-${{ matrix.goos }}-${{ matrix.goarch }}
          path: bin/*

  docker:
    needs: [test, version]
    runs-on: ubuntu-24.04
    env:
      VERSION: ${{ needs.version.outputs.version }}
      RELEASE: ${{ needs.version.outputs.release }}
      PUBLISH: ${{ (github.event_name == 'push' && github.ref == 'refs/heads/main') || needs.version.outputs.release == 'true' }}
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - if: env.PUBLISH == 'true'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          build-args: VERSION=${{ env.VERSION }}
          push: ${{ env.PUBLISH == 'true' }}
          # main -> :latest and :<sha>; a release -> :<version> and :stable
          tags: |
            ${{ env.RELEASE == 'true' && format('{0}:{1}', env.IMAGE, env.VERSION) || format('{0}:latest', env.IMAGE) }}
            ${{ env.RELEASE == 'true' && format('{0}:stable', env.IMAGE) || format('{0}:{1}', env.IMAGE, github.sha) }}

  # The player app. Windows is cross-compiled from Linux and packaged with NSIS.
  client-windows:
    needs: [test, version]
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: client
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # The wails3 CLI itself links against GTK on Linux.
      - run: sudo apt-get update && sudo apt-get install -y nsis libgtk-4-dev libwebkitgtk-6.0-dev
      - run: go install github.com/wailsapp/wails/v3/cmd/wails3@${{ env.WAILS_VERSION }}
      - name: Stamp version
        env:
          VERSION: ${{ needs.version.outputs.version }}
          NUMBER: ${{ needs.version.outputs.number }}
          RELEASE: ${{ needs.version.outputs.release }}
        run: |
          echo "$VERSION" > version.txt
          if [ "$RELEASE" = true ]; then
            # Installer, Info.plist and .exe details carry the release number.
            sed -i.bak -E "s/^(  version: )\".*\"/\1\"$NUMBER\"/" build/config.yml && rm build/config.yml.bak
            wails3 task common:update:build-assets
          fi
      - run: wails3 task windows:package ARCH=amd64 INSTALL_SCOPE=user
      - uses: actions/upload-artifact@v4
        with:
          name: catconnect-Windows
          path: |
            client/bin/catconnect.exe
            client/bin/catconnect-amd64-installer.exe

  client-macos:
    needs: [test, version]
    runs-on: macos-latest
    defaults:
      run:
        working-directory: client
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: go install github.com/wailsapp/wails/v3/cmd/wails3@${{ env.WAILS_VERSION }}
      - name: Stamp version
        env:
          VERSION: ${{ needs.version.outputs.version }}
          NUMBER: ${{ needs.version.outputs.number }}
          RELEASE: ${{ needs.version.outputs.release }}
        run: |
          echo "$VERSION" > version.txt
          if [ "$RELEASE" = true ]; then
            # Installer, Info.plist and .exe details carry the release number.
            sed -i.bak -E "s/^(  version: )\".*\"/\1\"$NUMBER\"/" build/config.yml && rm build/config.yml.bak
            wails3 task common:update:build-assets
          fi
      - run: wails3 task darwin:package:universal
      - run: cd bin && ditto -c -k --keepParent catconnect.app CatConnect-macOS.zip
      - uses: actions/upload-artifact@v4
        with:
          name: catconnect-macOS
          path: client/bin/CatConnect-macOS.zip

  client-linux:
    needs: [test, version]
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: client
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: sudo apt-get update && sudo apt-get install -y libgtk-4-dev libwebkitgtk-6.0-dev
      - run: go install github.com/wailsapp/wails/v3/cmd/wails3@${{ env.WAILS_VERSION }}
      - name: Stamp version
        env:
          VERSION: ${{ needs.version.outputs.version }}
          NUMBER: ${{ needs.version.outputs.number }}
          RELEASE: ${{ needs.version.outputs.release }}
        run: |
          echo "$VERSION" > version.txt
          if [ "$RELEASE" = true ]; then
            # Installer, Info.plist and .exe details carry the release number.
            sed -i.bak -E "s/^(  version: )\".*\"/\1\"$NUMBER\"/" build/config.yml && rm build/config.yml.bak
            wails3 task common:update:build-assets
          fi
      - run: wails3 build
      - uses: actions/upload-artifact@v4
        with:
          name: catconnect-Linux
          path: client/bin/catconnect

  # Collect everything into a GitHub release.
  release:
    if: needs.version.outputs.release == 'true'
    needs: [version, server, docker, client-windows, client-macos, client-linux]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    env:
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Collect release files
        run: |
          mkdir dist
          a=artifacts
          cp "$a/catconnect-Windows/catconnect-amd64-installer.exe" dist/CatConnect-Setup-windows-x64.exe
          cp "$a/catconnect-Windows/catconnect.exe"                 dist/CatConnect-portable-windows-x64.exe
          cp "$a/catconnect-macOS/CatConnect-macOS.zip"             dist/CatConnect-macOS.zip
          cp "$a/catconnect-Linux/catconnect"                       dist/CatConnect-linux-x64
          for f in "$a"/catconnect-server-*/catconnect-server-*; do
            cp "$f" dist/"$(basename "$f" | sed 's/amd64/x64/')"
          done
          chmod +x dist/CatConnect-linux-x64 dist/catconnect-server-linux-* dist/catconnect-server-darwin-*
          (cd dist && sha256sum * > SHA256SUMS.txt)
          ls -la dist
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cat > notes.md <<EOF
          ## Downloads

          **For players (the CatConnect app)**
          - Windows: \`CatConnect-Setup-windows-x64.exe\` (installer, recommended) or \`CatConnect-portable-windows-x64.exe\`
          - macOS: \`CatConnect-macOS.zip\` (Intel and Apple Silicon)
          - Linux: \`CatConnect-linux-x64\` (needs GTK 4 and WebKitGTK 6.0)

          **For the server owner (CatConnect Server)**
          - Docker: \`ghcr.io/sniphs98/catconnect-server:${VERSION}\` (see the README)
          - Or a single binary: \`catconnect-server-linux-x64\`, \`-linux-arm64\` (e.g. Raspberry Pi), \`-windows-x64.exe\`, \`-darwin-arm64\`

          The apps aren't code-signed. Windows: *More info → Run anyway*. macOS: right-click the app → *Open*
          (on macOS 15 and later: *System Settings → Privacy & Security → Open Anyway*).
          EOF
          if gh release view "$VERSION" >/dev/null 2>&1; then
            # Release already published on GitHub for a pushed tag: attach the files.
            gh release upload "$VERSION" dist/* --clobber
          else
            # Also creates the tag on this commit.
            gh release create "$VERSION" dist/* --target "$GITHUB_SHA" --title "CatConnect $VERSION" --notes-file notes.md --generate-notes
          fi

