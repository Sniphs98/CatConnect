<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>CatConnect Server</title>
  <link rel="icon" href="icon.svg"/>
  <link rel="stylesheet" href="style.css"/>
</head>
<body>
<div class="page">
  <header class="top">
    <div class="brand">
      <div class="logo"><img src="icon.svg" alt="" width="22" height="22"/></div>
      <div>
        <div class="brand-name">CatConnect <span class="muted">Server</span></div>
        <div class="brand-sub">Let friends join your game servers</div>
      </div>
    </div>
    <span class="pill ok live" id="status">Online</span>
  </header>

  <section class="card">
    <div class="card-head">
      <div>
        <h2>Share link</h2>
        <p class="sub">Send this to your friends. They paste it into the CatConnect app and can join every game below.</p>
      </div>
    </div>
    <div class="linkbox">
      <code id="link">…</code>
      <button class="btn primary" id="copy-link">Copy link</button>
    </div>
    <div class="row-between">
      <label class="field inline">
        <span>Server name</span>
        <input id="server-name" maxlength="40" spellcheck="false"/>
      </label>
      <button class="btn ghost small danger-text" id="reset-link" title="Creates a new link. The old one stops working for everyone.">Reset link</button>
    </div>
  </section>

  <section>
    <div class="section-head">
      <h2>Games</h2>
      <div class="add">
        <select id="preset-select" aria-label="Game preset"></select>
        <button class="btn ghost" id="add-game">Add game</button>
      </div>
    </div>
    <div id="games" class="list"></div>
  </section>

  <section>
    <div class="section-head">
      <h2>Players</h2>
      <span class="sub" id="players-sub"></span>
    </div>
    <div id="players" class="list"></div>
  </section>

  <p class="foot">CatConnect <span id="version"></span> · powered by tailcat · not affiliated with Tailscale Inc.</p>
</div>

<div class="savebar" id="savebar" hidden>
  <span>Unsaved changes</span>
  <span class="err" id="save-error"></span>
  <button class="btn ghost" id="discard">Discard</button>
  <button class="btn primary" id="save">Save</button>
</div>

<div class="toasts" id="toasts"></div>
<script src="app.js"></script>
</body>
</html>
